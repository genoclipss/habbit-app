<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Habit Tracker</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#191919">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400&display=swap">
    <style>
        :root {
            --bg: #191919;
            --pn: #2b2b2b;
            --cd: #373737;
            --ln: #3a3a3a;
            --tx: #ffffffcf;
            --mu: #9b9b9b;
            --bl: #2383e2;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px);
            background: var(--bg)
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font: 14px/1.45 ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif
        }

        #app {
            max-width: 1240px;
            margin: 0 auto;
            padding: 16px;
            display: grid;
            gap: 16px
        }

        .top {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 16px;
            align-items: start
        }

        @media(max-width:820px) {
            .top {
                grid-template-columns: 1fr
            }
        }

        .pn {
            background: var(--pn);
            border-radius: 10px;
            padding: 18px 20px;
            min-width: 0
        }

        .ph {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 10px
        }

        h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px
        }

        .ic {
            width: 16px;
            height: 16px;
            flex: none;
            color: var(--mu)
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--cd);
            border-radius: 6px;
            padding: 3px 10px;
            font-size: 13px;
            margin: 0 0 8px
        }

        button {
            font: inherit;
            color: inherit;
            background: transparent;
            border: 0;
            border-radius: 5px;
            padding: 4px 9px;
            cursor: pointer
        }

        button:hover {
            background: #ffffff14
        }

        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible {
            outline: 2px solid var(--bl);
            outline-offset: 1px
        }

        .tb {
            display: flex;
            gap: 2px;
            align-items: center;
            color: var(--mu)
        }

        .tb .nw {
            background: var(--bl);
            color: #fff;
            padding: 4px 12px
        }

        ul.hlist {
            margin: 0;
            padding-left: 20px
        }

        ul.hlist li {
            padding: 4px 0;
            font-size: 15px
        }

        .tw {
            overflow-x: auto
        }

        table {
            border-collapse: collapse;
            width: 100%
        }

        th,
        td {
            padding: 7px 8px;
            border-bottom: 1px solid var(--ln);
            white-space: nowrap;
            text-align: left;
            font-weight: 400
        }

        th {
            color: var(--mu);
            font-size: 12.5px
        }

        th .ic {
            display: inline;
            vertical-align: -3px;
            margin-right: 5px
        }

        th.hb {
            font-size: 15px;
            text-align: center
        }

        td:nth-child(n+3) {
            text-align: center
        }

        td:last-child {
            text-align: left
        }

        td.off {
            color: var(--mu);
            opacity: .35
        }

        tr.td td:first-child {
            color: #fff;
            font-weight: 600
        }

        tr.td {
            background: #ffffff08
        }

        tfoot td {
            border: 0;
            color: var(--mu);
            font-size: 12.5px;
            padding-top: 14px
        }

        tfoot td.avl {
            font-size: 10.5px;
            letter-spacing: .1em;
            text-align: right
        }

        .ck {
            width: 18px;
            height: 18px;
            padding: 0;
            border: 1.5px solid #6b6b6b;
            border-radius: 4px;
            vertical-align: middle
        }

        .ck.on {
            background: var(--bl);
            border-color: var(--bl)
        }

        .ck.on::after {
            content: "✓";
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            line-height: 1
        }

        .bar {
            display: inline-flex;
            gap: 2px;
            vertical-align: middle;
            margin-right: 6px
        }

        .bar i {
            width: 8px;
            height: 12px;
            border-radius: 1px;
            background: #555
        }

        .bar i.f {
            background: #ececec
        }

        input,
        textarea {
            font: inherit;
            color: inherit;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 5px;
            padding: 3px 6px
        }

        input:hover {
            border-color: var(--ln)
        }

        .nt {
            width: 150px
        }

        .gal {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px
        }

        @media(max-width:820px) {
            .gal {
                grid-template-columns: repeat(2, 1fr)
            }
        }

        .mc {
            display: block;
            width: 100%;
            padding: 0;
            text-align: left;
            background: var(--cd);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 0 1px #ffffff12
        }

        .mc.sel {
            box-shadow: 0 0 0 2px var(--bl)
        }

        .mc .cv {
            background: #fff;
            color: #111;
            height: 112px;
            display: flex;
            align-items: center;
            justify-content: center;
            font: 300 24px Poppins, sans-serif;
            letter-spacing: .28em;
            padding-left: .28em
        }

        .mc .cb {
            padding: 10px 12px;
            display: grid;
            gap: 6px
        }

        .mc .cb span {
            display: flex;
            align-items: center;
            gap: 7px
        }

        .hr {
            display: flex;
            gap: 6px;
            align-items: center;
            padding: 5px 0;
            border-bottom: 1px solid var(--ln);
            flex-wrap: wrap
        }

        .hr .e {
            width: 42px;
            text-align: center
        }

        .hr .n {
            flex: 1;
            min-width: 120px;
            border-color: var(--ln)
        }

        .hr small {
            color: var(--mu)
        }

        .mg {
            margin-top: 14px;
            padding-top: 6px;
            border-top: 1px solid var(--ln)
        }

        textarea {
            width: 100%;
            height: 70px;
            box-sizing: border-box;
            background: var(--bg);
            border-color: var(--ln);
            font: 11px monospace
        }

        .sub {
            color: var(--mu);
            font-size: 12.5px
        }

        footer {
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 16px 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            color: var(--mu);
            font-size: 12.5px
        }

        #auth {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9;
            padding: 16px
        }

        #auth[hidden],
        #lo[hidden] {
            display: none
        }

        #auth .pn {
            width: 100%;
            max-width: 340px;
            display: grid;
            gap: 8px
        }

        #auth input {
            border-color: var(--ln);
            padding: 8px
        }

        #auth button {
            background: var(--cd);
            padding: 8px
        }

        #auth button.a {
            background: var(--bl);
            color: #fff
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>

<body>
    <div id="auth" hidden>
        <div class="pn">
            <h2>Habit Tracker</h2><input id="ae" type="email" placeholder="Email" autocomplete="email"><input id="ap"
                type="password" placeholder="Password" autocomplete="current-password"><button class="a" id="ain">Sign
                in</button><button id="aup">Create account</button>
            <div class="sub" id="am"></div>
        </div>
    </div>
    <main id="app"></main>
    <footer><span id="st">local only</span><button id="lo" hidden>Sign out</button></footer>
    <script>
        const K = 'habit-tracker-v1', P = n => String(n).padStart(2, '0'), iso = d => d.getFullYear() + '-' + P(d.getMonth() + 1) + '-' + P(d.getDate());
        const TD = iso(new Date()), E = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])), fmt = (d, o) => d.toLocaleDateString('en-US', o), $ = s => document.querySelector(s);
        const DEF = [['😴', 'Sleep 7-8 hours'], ['🥗', 'Eat healthy meals'], ['📱', 'Social media ≤ 90min'], ['🚫', 'No porn/alcohol'], ['💧', 'Drink 2L water'], ['💻', 'Study ≥ 2 hours'], ['🏋️', 'Exercise 30 minutes'], ['📖', 'Read 30 minutes'], ['✍️', 'Journal & self-reflect'], ['📋', "Plan tomorrow's tasks"]].map((x, i) => ({ id: 'h' + i, emoji: x[0], name: x[1], start: '2000-01-01' }));
        let S = { habits: DEF, log: {}, notes: {} };
        try { const r = localStorage.getItem(K); if (r) S = JSON.parse(r) } catch (e) { }
        let W = new Date(), M = new Date(), Y = new Date().getFullYear(), ED = false;
        const act = (h, k) => k >= h.start && (!h.end || k < h.end), done = (k, id) => (S.log[k] || []).includes(id);
        const pct = k => { const a = S.habits.filter(h => act(h, k)); return a.length ? Math.round(100 * a.filter(h => done(k, h.id)).length / a.length) : 0 };
        const bar = p => '<span class="bar">' + Array.from({ length: 10 }, (_, i) => `<i class="${i < Math.round(p / 10) ? 'f' : ''}"></i>`).join('') + '</span>' + p + '%';
        const streak = id => { let d = new Date(), n = 0; if (!done(iso(d), id)) d.setDate(d.getDate() - 1); while (done(iso(d), id)) { n++; d.setDate(d.getDate() - 1) } return n };
        const live = () => S.habits.filter(h => !h.end || h.end > TD);
        const PATH = { l: 'M5 4h8M5 8h8M5 12h8M2.5 4h.01M2.5 8h.01M2.5 12h.01', c: 'M3 3.5h10v9.5H3zM3 6.5h10M6 2v3M10 2v3' };
        const ic = n => `<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="${PATH[n]}"/></svg>`;
        const nav = k => `<div class="tb"><button data-nav="${k}" data-s="-1" aria-label="Previous">‹</button><button data-nav="${k}" data-s="0">Today</button><button data-nav="${k}" data-s="1" aria-label="Next">›</button></div>`;
        function table(days) {
            const f = iso(days[0]), l = iso(days[days.length - 1]), hs = S.habits.filter(h => h.start <= l && (!h.end || h.end > f));
            let h = '<div class="tw"><table><thead><tr><th>' + ic('c') + 'Date<th>Progress Bar' + hs.map(x => `<th class="hb" title="${E(x.name)}">${E(x.emoji)}`).join('') + '<th>Notes</tr></thead><tbody>';
            for (const d of days) { const k = iso(d); h += `<tr class="${k == TD ? 'td' : ''}"><td>${fmt(d, { month: 'long', day: 'numeric', year: 'numeric' })}<td>${bar(pct(k))}` + hs.map(x => act(x, k) ? `<td><button class="ck ${done(k, x.id) ? 'on' : ''}" data-d="${k}" data-h="${x.id}" aria-label="${E(x.name)}"></button>` : '<td class="off">·').join('') + `<td><input class="nt" data-n="${k}" value="${E(S.notes[k] || '')}" placeholder="Empty"></tr>` }
            return h + '</tbody><tfoot><tr><td class="avl">AVERAGE<td>' + hs.map(x => { const ds = days.map(iso).filter(k => k <= TD && act(x, k)); return '<td>' + (ds.length ? Math.round(100 * ds.filter(k => done(k, x.id)).length / ds.length) : 0) }).join('') + '<td></tr></tfoot></table></div>'
        }
        const mAvg = (y, m) => { const ks = Array.from({ length: new Date(y, m + 1, 0).getDate() }, (_, i) => iso(new Date(y, m, i + 1))).filter(k => k <= TD); return ks.length ? Math.round(ks.reduce((s, k) => s + pct(k), 0) / ks.length) : 0 };
        function manager() {
            let h = '<div class="mg">';
            for (const x of live()) h += `<div class="hr"><input class="e" data-e="${x.id}" value="${E(x.emoji)}" aria-label="Emoji"><input class="n" data-nm="${x.id}" value="${E(x.name)}" aria-label="Name"><small>${streak(x.id)}d streak</small><button data-x="${x.id}">Archive</button></div>`;
            h += '<div class="hr"><input class="e" id="ne" placeholder="⭐"><input class="n" id="nn" placeholder="New habit"><button data-add="1" style="background:var(--bl);color:#fff">Add</button></div>';
            return h + '<p class="sub">Archived habits keep their history. New habits count from today.</p><textarea id="bk">' + E(JSON.stringify(S)) + '</textarea><div class="tb"><button data-imp="1">Restore from backup</button><span class="sub" id="msg"></span></div></div>'
        }
        function render() {
            const s = new Date(W); s.setDate(s.getDate() - s.getDay());
            const wd = Array.from({ length: 7 }, (_, i) => { const d = new Date(s); d.setDate(s.getDate() + i); return d });
            const my = M.getFullYear(), mm = M.getMonth(), md = Array.from({ length: new Date(my, mm + 1, 0).getDate() }, (_, i) => new Date(my, mm, i + 1));
            const chip = '<div class="chip">' + ic('l').replace('class="ic"', 'class="ic" style="width:14px"') + 'Table</div>';
            $('#app').innerHTML = `<div class="top"><section class="pn"><div class="ph"><h2>${ic('l')}Habit List</h2><div class="tb"><button data-ed="1">${ED ? 'Done' : 'Edit'}</button></div></div><ul class="hlist">${live().map(x => `<li>${E(x.name)} ${E(x.emoji)}</li>`).join('')}</ul>${ED ? manager() : ''}</section>
<section class="pn"><div class="ph"><h2>${ic('c')}This Week</h2>${nav('w')}</div>${chip}${table(wd)}</section></div>
<section class="pn" id="pm"><div class="ph"><h2>${ic('c')}This Month</h2><div class="tb"><span class="sub">${fmt(M, { month: 'long', year: 'numeric' })}</span>${nav('m')}</div></div>${chip}${table(md)}</section>
<section class="pn"><div class="ph"><h2>${ic('c')}Monthly Overview</h2><div class="tb"><span class="sub">${Y}</span>${nav('y')}</div></div><div class="gal">${Array.from({ length: 12 }, (_, m) => { const n = fmt(new Date(Y, m, 1), { month: 'long' }); return `<button class="mc ${my == Y && mm == m ? 'sel' : ''}" data-m="${m}"><div class="cv">${n}</div><div class="cb"><span>${ic('c')}${n}</span><span>${bar(mAvg(Y, m))}</span></div></button>` }).join('')}</div></section>`
        }
        function shift(k, n) { if (k == 'w') { if (!n) W = new Date(); else W.setDate(W.getDate() + 7 * n) } else if (k == 'm') { M = n ? new Date(M.getFullYear(), M.getMonth() + n, 1) : new Date() } else Y = n ? Y + n : new Date().getFullYear() }
        const SB_URL = 'https://mscetcmrlernkjbkixcs.supabase.co.', SB_KEY = 'sb_publishable_HyCLIOEmZrgB_8OjMC3ESQ_2CyRpwFR';
        let sb = null, UID = null, synced = false, tm = null; const dirty = new Set();
        const setSt = t => { const e = document.getElementById('st'); if (e) e.textContent = t };
        const pre = (o, y) => Object.fromEntries(Object.entries(o).filter(x => x[0].startsWith(y)));
        const local = () => { try { localStorage.setItem(K, JSON.stringify(S)) } catch (e) { } };
        function save(k) { local(); if (!UID) return; dirty.add(k); setSt('saving…'); clearTimeout(tm); tm = setTimeout(flush, 700) }
        async function flush() {
            const ks = [...dirty]; dirty.clear(); try {
                const all = ks.includes('all'), rows = [];
                const ys = new Set(all ? [...Object.keys(S.log), ...Object.keys(S.notes)].map(k => k.slice(0, 4)) : ks.filter(k => k != 'h'));
                if (all || ks.includes('h')) rows.push({ user_id: UID, key: 'meta', value: { habits: S.habits } });
                ys.forEach(y => { if (/^\d{4}$/.test(y)) rows.push({ user_id: UID, key: 'y' + y, value: { log: pre(S.log, y), notes: pre(S.notes, y) } }) });
                if (rows.length) { const r = await sb.from('habit_data').upsert(rows); if (r.error) throw r.error }
                setSt('☁ synced')
            } catch (e) { ks.forEach(k => dirty.add(k)); setSt('offline, retrying'); tm = setTimeout(flush, 5000) }
        }
        function apply(rows) {
            const first = !synced; synced = true;
            if (first && !rows.some(r => r.key == 'meta')) { save('all'); return }
            if (dirty.size) return;
            for (const r of rows) {
                const v = r.value || {};
                if (r.key == 'meta' && Array.isArray(v.habits)) S.habits = v.habits;
                else if (/^y\d{4}$/.test(r.key)) { const y = r.key.slice(1); for (const o of [S.log, S.notes]) for (const k of Object.keys(o)) if (k.startsWith(y)) delete o[k]; Object.assign(S.log, v.log || {}); Object.assign(S.notes, v.notes || {}) }
            }
            local(); setSt('☁ synced'); const a = document.activeElement;
            if (!(a && a.tagName == 'INPUT' && a.closest('#app'))) render()
        }
        async function pull() { try { const r = await sb.from('habit_data').select('key,value'); if (r.error) throw r.error; apply(r.data) } catch (e) { setSt('offline, local data') } }
        function begin(id) { UID = id; document.getElementById('auth').hidden = true; document.getElementById('lo').hidden = false; setSt('connecting…'); pull() }
        (async () => {
            try {
                if (!window.supabase || SB_URL.startsWith('PASTE')) return setSt('local only (not configured)');
                sb = supabase.createClient(SB_URL, SB_KEY);
                const g = await sb.auth.getSession();
                if (g.data.session) begin(g.data.session.user.id); else document.getElementById('auth').hidden = false;
                const go = async up => {
                    const m = document.getElementById('am'), c = { email: document.getElementById('ae').value.trim(), password: document.getElementById('ap').value }; m.textContent = '…';
                    const r = up ? await sb.auth.signUp(c) : await sb.auth.signInWithPassword(c);
                    if (r.error) m.textContent = r.error.message; else if (r.data.session) begin(r.data.user.id); else m.textContent = 'Check your email to confirm, then sign in.'
                };
                document.getElementById('ain').onclick = () => go(false); document.getElementById('aup').onclick = () => go(true);
                document.getElementById('lo').onclick = async () => { await sb.auth.signOut(); location.reload() };
                document.addEventListener('visibilitychange', () => { if (!document.hidden && UID && !dirty.size) pull() });
            } catch (e) { setSt('local only') }
        })();
        $('#app').addEventListener('click', e => {
            const t = e.target.closest('button'); if (!t) return; const d = t.dataset;
            if (d.d) { const l = S.log[d.d] || (S.log[d.d] = []), i = l.indexOf(d.h); i < 0 ? l.push(d.h) : l.splice(i, 1); save(d.d.slice(0, 4)) }
            else if (d.nav) { shift(d.nav, +d.s) }
            else if (d.m !== undefined) { M = new Date(Y, +d.m, 1); render(); $('#pm').scrollIntoView({ behavior: 'smooth' }); return }
            else if (d.ed) ED = !ED;
            else if (d.x) { S.habits.find(h => h.id == d.x).end = TD; save('h') }
            else if (d.add) { const n = $('#nn').value.trim(); if (!n) return; S.habits.push({ id: 'h' + Date.now(), emoji: $('#ne').value.trim() || '⭐', name: n, start: TD }); save('h') }
            else if (d.imp) { try { const o = JSON.parse($('#bk').value); if (!Array.isArray(o.habits)) throw 0; S = { habits: o.habits, log: o.log || {}, notes: o.notes || {} }; save('all') } catch (x) { $('#msg').textContent = 'Invalid format'; return } }
            else return; render()
        });
        $('#app').addEventListener('change', e => {
            const d = e.target.dataset, v = e.target.value;
            if (d.n !== undefined) { S.notes[d.n] = v; save(d.n.slice(0, 4)) } else if (d.nm) { S.habits.find(h => h.id == d.nm).name = v; save('h') } else if (d.e) { S.habits.find(h => h.id == d.e).emoji = v; save('h') }
        });
        render();
        if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => { });
    </script>
</body>

</html>
